<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container mt-4">
      <h2 class="mb-4">Шаблоны</h2>
      <div class="mb-3">
        <input
          type="text"
          id="tokenInput"
          class="form-control"
          placeholder="Введите API токен" />
      </div>
      <button id="loadBtn" class="btn btn-primary mb-4">Загрузить</button>
      <div id="templatesList"></div>
    </div>

    <script>
      async function loadTemplates() {
        const token = document.getElementById('tokenInput').value.trim();
        if (!token) {
          alert('Введите токен!');
          return;
        }

        const container = document.getElementById('templatesList');
        container.innerHTML = '<p>Загрузка...</p>';

        try {
          const response = await fetch(
            'https://inventory-server-two.vercel.app/api/odoo/aggregated/get',
            {
              headers: { 'x-api-token': token },
            }
          );

          if (!response.ok) throw new Error(`Ошибка ${response.status}`);
          const data = await response.json();
          renderTemplates(data);
        } catch (err) {
          console.error(err);
          container.innerHTML = `<p class='text-danger'>Ошибка загрузки: ${err.message}</p>`;
        }
      }

      function renderTemplates(data) {
        const container = document.getElementById('templatesList');
        if (!data || data.length === 0) {
          container.innerHTML = '<p>Нет доступных шаблонов</p>';
          return;
        }

        let html = `<table class="table table-bordered table-hover">
      <thead class="table-light">
        <tr>
          <th>Название шаблона</th>
          <th>Автор</th>
          <th>Вопрос</th>
          <th>Тип</th>
          <th>Количество ответов</th>
          <th>Детали</th>
        </tr>
      </thead>
      <tbody>`;

        data.forEach((template) => {
          if (template.questions && template.questions.length > 0) {
            template.questions.forEach((q, idx) => {
              html += `<tr>
            ${
              idx === 0
                ? `<td rowspan="${template.questions.length}">${template.title}</td>
                           <td rowspan="${template.questions.length}">${template.author}</td>`
                : ''
            }

            <td>${q.text}</td>
            <td>${q.type}</td>
            <td>${q.count}</td>
            <td>
              ${
                q.type === 'text' || q.type === 'link'
                  ? q.top_answers
                      .map((a) => `${a.value} (${a.count})`)
                      .join(', ')
                  : q.type === 'number'
                  ? `min: ${q.min}, max: ${q.max}, avg: ${q.avg?.toFixed(2)}`
                  : q.type === 'boolean'
                  ? `true: ${q.counts?.true || 0}, false: ${
                      q.counts?.false || 0
                    }`
                  : '-'
              }
            </td>
          </tr>`;
            });
          } else {
            html += `<tr>
          <td>${template.title}</td>
          <td>${template.author}</td>
          <td colspan="4" class="text-center">Нет данных по вопросам</td>
        </tr>`;
          }
        });

        html += '</tbody></table>';
        container.innerHTML = html;
      }

      // вешаем обработчик на кнопку
      document
        .getElementById('loadBtn')
        .addEventListener('click', loadTemplates);
    </script>
  </body>
</html>
